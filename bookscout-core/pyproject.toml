[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bookscout-core"
version = "0.1.0"
description = "Framework-independent core skeleton for BookScout"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["bookscout*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
